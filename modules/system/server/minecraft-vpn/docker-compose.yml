networks:
  playit-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/29

services:
  playit:
    image: ghcr.io/playit-cloud/playit-agent:latest
    container_name: playit-agent
    restart: unless-stopped
    networks:
      playit-net:
        ipv4_address: 172.28.0.2
    environment:
      SECRET_KEY: "${PLAYIT_SECRET_KEY}"
    # secrets:
    #   - playit-secret.key
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    # user: "4440:4440"

  mc:
    image: itzg/minecraft-server:stable
    container_name: minecraft
    tty: true
    stdin_open: true
    user: "4440:4440"
    networks:
      playit-net:
        ipv4_address: 172.28.0.3
    environment:
      # EXTRA_ARGS: "--safeMode" # TEMP, to fix paper->neoforge switch
      # LEVEL: "world-test"
      LEVEL: "world"
      VERSION: "26.1.2"
      EULA: "TRUE"
      # TYPE: "PAPER"
      TYPE: "NEOFORGE"
      NEOFORGE_VERSION: "26.1.2.87"
      MEMORY: "3072M"
      USE_MEOWICE_FLAGS: "true"
      ONLINE_MODE: "FALSE"
      ENABLE_WHITELIST: "false"
      ENFORCE_WHITELIST: "false"
      ENABLE_RCON: "true"
      RCON_PORT: "25575"
      RCON_PASSWORD_FILE: "/run/secrets/mc-rcon-pass.key"
      SPAWN_PROTECTION: "0"
      ENFORCE_SECURE_PROFILE: "false"
      MODRINTH_DOWNLOAD_DEPENDENCIES: none
      MODRINTH_PROJECTS: |
        no-chat-restrictions
        skinrestorer
        chest-locker
        key
        patpat?
        forever-pets
        unlimited-villager-trades
      # ly-graves
      # tpa
      # grieflogger
      # yamlconfig
      # knot
      # gun-core
      # modern-guns
      # connector
      # call-of-the-king
      # giantess-toki (might break, needs client-side)
      # touhou-little-maid (might break, needs client-side)
    volumes:
      - ./data:/data
      - ./mods:/mods
      # - /etc/secrets/mc-rcon-pass.key:/run/secrets/mc-rcon-pass.key:ro
    secrets:
      - mc-rcon-pass.key
    tmpfs:
      - /tmp:exec,mode=1777,size=512m
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
    security_opt:
      - no-new-privileges:true
    read_only: true  # remove if plugins cause perm denied errors
    mem_limit: 4g
    # cpus: 3.5
    cpuset: "0"
    pids_limit: 512
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped

  backups:
    image: itzg/mc-backup:stable
    container_name: minecraft-backup
    networks:
      playit-net:
        ipv4_address: 172.28.0.4
    environment:
      RCON_HOST: "172.28.0.3"
      RCON_PASSWORD_FILE: "/run/secrets/mc-rcon-pass.key"
      BACKUP_INTERVAL: "6h"
      PRUNE_BACKUPS_DAYS: "7"
    secrets:
      - mc-rcon-pass.key
    volumes:
      - ./data:/data:ro
      - ./backups:/backups
      # - /etc/secrets/mc-rcon-pass.key:/run/secrets/mc-rcon-pass.key:ro
    depends_on:
      mc:
        condition: service_healthy
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    user: "4440:4440"
    restart: unless-stopped

secrets:
  # playit-secret.key:
  #   file: /etc/secrets/playit-secret.key
  mc-rcon-pass.key:
    file: /etc/secrets/mc-rcon-pass.key
